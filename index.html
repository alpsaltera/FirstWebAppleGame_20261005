<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HTML5 모바일 사과게임</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            height: 100vh;
        }
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            /* 💡 [수정] 상하좌우에 반 칸(0.5칸)씩 여백이 생겨 가로 13칸, 세로 18칸 비율로 프레임 조정 */
            aspect-ratio: 13 / 18;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            touch-action: none;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div id="score-board">SCORE: <span id="score">0</span></div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // 오리지널 사과게임 비율과 크기 (12행 17열)
        const COLS = 12;
        const ROWS = 17;
        let score = 0;
        let grid = [];

        // 드래그 상태 관리
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;

        // 사과 1칸의 고정 크기
        const APPLE_SIZE_BASE = 40;

        // 💡 [수정] 상하좌우 반 칸(20px) 여백 공간 변수 설정
        const PADDING_X = APPLE_SIZE_BASE * 0.5; // 좌우 각각 20px
        const PADDING_Y = APPLE_SIZE_BASE * 0.5; // 상하 각각 20px

        // 💡 [수정] 여백이 추가된 전체 내부 해상도 계산
        // 가로: (12칸 * 40px) + 좌우여백 40px = 520px
        // 세로: (17칸 * 40px) + 상하여백 40px = 720px
        const CANVAS_WIDTH = (COLS * APPLE_SIZE_BASE) + (PADDING_X * 2);
        const CANVAS_HEIGHT = (ROWS * APPLE_SIZE_BASE) + (PADDING_Y * 2); 
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const CELL_W = APPLE_SIZE_BASE;
        const CELL_H = APPLE_SIZE_BASE;

        // 사과 이미지 객체 생성 및 로드
        const appleImg = new Image();
        appleImg.src = 'apple.png';
        
        appleImg.onload = function() {
            initGame();
        };

        // 1. 사과 데이터 초기화
        function initGame() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = {
                        number: Math.floor(Math.random() * 9) + 1,
                        isCleared: false
                    };
                }
            }
            draw();
        }

        // 2. 화면 그리기 기능
        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 사과 및 숫자 그리기
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const apple = grid[r][c];
                    if (apple.isCleared) continue;

                    // 💡 [수정] 기존 좌표에 여백(PADDING) 값을 더해 사과들이 안쪽으로 모이게 만듭니다.
                    const x = (c * CELL_W) + PADDING_X;
                    const y = (r * CELL_H) + PADDING_Y;

                    // 사과를 화사하고 밝게 연출하는 필터 적용
                    ctx.filter = "brightness(1.15) contrast(1.1)";

                    const appleSize = CELL_W * 1.1; 
                    const offsetX = (appleSize - CELL_W) / 2;
                    const offsetY = (appleSize - CELL_H) / 2;

                    ctx.drawImage(appleImg, x - offsetX, y - offsetY, appleSize, appleSize);

                    // 숫자를 그릴 때는 필터 해제
                    ctx.filter = "none";

                    // 숫자 텍스트 설정
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${CELL_W * 0.38}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.lineWidth = 2.5;

                    const textY = y + CELL_H / 2 + (CELL_H * 0.03);
                    
                    ctx.strokeText(apple.number, x + CELL_W / 2, textY);
                    ctx.fillText(apple.number, x + CELL_W / 2, textY);
                }
            }

            // 드래그 중일 때 선택 영역 박스 표시
            if (isDragging) {
                ctx.strokeStyle = 'rgba(0, 150, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.fillStyle = 'rgba(0, 150, 255, 0.2)';
                
                const width = currentX - startX;
                const height = currentY - startY;
                
                ctx.fillRect(startX, startY, width, height);
                ctx.strokeRect(startX, startY, width, height);
            }
        }

        // 3. 좌표 변환 함수
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;

            return {
                x: (clientX - rect.left) * (CANVAS_WIDTH / rect.width),
                y: (clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
            };
        }

        // 4. 드래그 시작 이벤트
        function onStart(e) {
            if (e.cancelable) e.preventDefault();
            isDragging = true;
            const coords = getCanvasCoords(e);
            startX = currentX = coords.x;
            startY = currentY = coords.y;
            draw();
        }

        // 5. 드래그 중 이벤트
        function onMove(e) {
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();
            const coords = getCanvasCoords(e);
            currentX = coords.x;
            currentY = coords.y;
            draw();
        }

        // 6. 드래그 종료 및 조건 검증
        function onEnd(e) {
            if (!isDragging) return;
            isDragging = false;

            const x1 = Math.min(startX, currentX);
            const x2 = Math.max(startX, currentX);
            const y1 = Math.min(startY, currentY);
            const y2 = Math.max(startY, currentY);

            let sum = 0;
            let selectedApples = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const apple = grid[r][c];
                    if (apple.isCleared) continue;

                    // 💡 [수정] 마우스/터치 판정 계산 시에도 여백(PADDING) 위치 값을 포함하도록 보정합니다.
                    const appleX = (c * CELL_W) + PADDING_X + CELL_W / 2;
                    const appleY = (r * CELL_H) + PADDING_Y + CELL_H / 2;

                    if (appleX >= x1 && appleX <= x2 && appleY >= y1 && appleY <= y2) {
                        sum += apple.number;
                        selectedApples.push(apple);
                    }
                }
            }

            if (sum === 10 && selectedApples.length > 0) {
                selectedApples.forEach(apple => apple.isCleared = true);
                score += selectedApples.length;
                scoreElement.innerText = score;
            }

            draw();
        }

        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
    </script>
</body>
</html>
