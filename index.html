<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HTML5 모바일 사과게임</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            height: 100vh;
        }
        #score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 10 / 17;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            touch-action: none;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div id="score-board">SCORE: <span id="score">0</span></div>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // 가로 9열, 세로 16행 구조 유지
        const COLS = 9;
        const ROWS = 16;
        let score = 0;
        let grid = [];

        // 드래그 상태 관리
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;

        // 사과 1칸의 고정 크기
        const APPLE_SIZE_BASE = 40;

        // 상하좌우 반 칸(20px) 여백 공간 변수 설정
        const PADDING_X = APPLE_SIZE_BASE * 0.5;
        const PADDING_Y = APPLE_SIZE_BASE * 0.5;

        // 해상도 계산
        const CANVAS_WIDTH = (COLS * APPLE_SIZE_BASE) + (PADDING_X * 2);
        const CANVAS_HEIGHT = (ROWS * APPLE_SIZE_BASE) + (PADDING_Y * 2); 
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        const CELL_W = APPLE_SIZE_BASE;
        const CELL_H = APPLE_SIZE_BASE;

        // 사과 이미지 객체 생성 및 로드
        const appleImg = new Image();
        appleImg.src = 'apple.png';
        
        appleImg.onload = function() {
            initGame();
        };

        // 이미지 캐싱 예외처리 방어 로직
        if (appleImg.complete) {
            setTimeout(() => { if(grid.length === 0) initGame(); }, 50);
        }

        // 1. 사과 데이터 초기화
        function initGame() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = {
                        number: Math.floor(Math.random() * 9) + 1,
                        isCleared: false
                    };
                }
            }
            draw();
        }

        // 드래그 영역 계산 함수
        function getDragArea() {
            return {
                x1: Math.min(startX, currentX),
                x2: Math.max(startX, currentX),
                y1: Math.min(startY, currentY),
                y2: Math.max(startY, currentY)
            };
        }

        // 2. 화면 그리기 기능
        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            const dragArea = isDragging ? getDragArea() : null;

            // 사과 및 숫자 그리기
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const apple = grid[r][c];
                    if (apple.isCleared) continue;

                    const x = (c * CELL_W) + PADDING_X;
                    const y = (r * CELL_H) + PADDING_Y;

                    const appleX = x + CELL_W / 2;
                    const appleY = y + CELL_H / 2;

                    // 현재 사과가 드래그 영역 안에 있는지 체크
                    let isSelected = false;
                    if (dragArea) {
                        if (appleX >= dragArea.x1 && appleX <= dragArea.x2 && appleY >= dragArea.y1 && appleY <= dragArea.y2) {
                            isSelected = true;
                        }
                    }

                    const appleSize = CELL_W * 1.1; 
                    const offsetX = (appleSize - CELL_W) / 2;
                    const offsetY = (appleSize - CELL_H) / 2;
                    const drawX = x - offsetX;
                    const drawY = y - offsetY;

                    // 💡 유저님이 요청하신 '3px 두께의 선명한 이미지 스프라이트 외곽선' 구현
                    if (isSelected) {
                        ctx.save();
                        const thickness = 3;
                        // 선명한 파란색 단색 라인을 따주는 컬러 필터 매핑
                        ctx.filter = "brightness(0) saturate(100%) invert(53%) sepia(93%) saturate(2644%) hue-rotate(174deg) brightness(104%) contrast(106%)"; 
                        
                        // 3px 외곽선의 촘촘한 정밀도를 위해 8방향 겹쳐 그리기 처리
                        for (let dx = -thickness; dx <= thickness; dx += thickness) {
                            for (let dy = -thickness; dy <= thickness; dy += thickness) {
                                if (dx === 0 && dy === 0) continue;
                                ctx.drawImage(appleImg, drawX + dx, drawY + dy, appleSize, appleSize);
                            }
                        }
                        ctx.restore();
                    }

                    // 원본 사과 이미지 출력 (브라우저 충돌을 피하기 위해 필터를 완전히 제거했습니다)
                    ctx.drawImage(appleImg, drawX, drawY, appleSize, appleSize);

                    // 숫자 텍스트 설정
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${CELL_W * 0.35}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.lineWidth = 2.5;

                    // 정중앙 10% 하단 최적화 정렬 위치 유지
                    const textY = y + CELL_H / 2 + (CELL_H * 0.1);
                    
                    ctx.strokeText(apple.number, x + CELL_W / 2, textY);
                    ctx.fillText(apple.number, x + CELL_W / 2, textY);
                }
            }

            // 드래그 중일 때 선택 영역 박스 표시
            if (isDragging) {
                ctx.strokeStyle = 'rgba(0, 150, 255, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.fillStyle = 'rgba(0, 150, 255, 0.04)';
                
                const width = currentX - startX;
                const height = currentY - startY;
                
                ctx.fillRect(startX, startY, width, height);
                ctx.strokeRect(startX, startY, width, height);
            }
        }

        // 3. 좌표 변환 함수 (기존 초기 안정형 마우스/터치 호환 코드로 롤백)
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: (clientX - rect.left) * (CANVAS_WIDTH / rect.width),
                y: (clientY - rect.top) * (CANVAS_HEIGHT / rect.height)
            };
        }

        // 4. 드래그 시작 이벤트
        function onStart(e) {
            if (e.cancelable) e.preventDefault();
            isDragging = true;
            const coords = getCanvasCoords(e);
            startX = currentX = coords.x;
            startY = currentY = coords.y;
            draw();
        }

        // 5. 드래그 중 이벤트
        function onMove(e) {
            if (!isDragging) return;
            if (e.cancelable) e.preventDefault();
            const coords = getCanvasCoords(e);
            currentX = coords.x;
            currentY = coords.y;
            draw();
        }

        // 6. 드래그 종료 및 조건 검증
        function onEnd(e) {
            if (!isDragging) return;
            isDragging = false;

            const dragArea = getDragArea();
            let sum = 0;
            let selectedApples = [];

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const apple = grid[r][c];
                    if (apple.isCleared) continue;

                    const appleX = (c * CELL_W) + PADDING_X + CELL_W / 2;
                    const appleY = (r * CELL_H) + PADDING_Y + CELL_H / 2;

                    if (appleX >= dragArea.x1 && appleX <= dragArea.x2 && appleY >= dragArea.y1 && appleY <= dragArea.y2) {
                        sum += apple.number;
                        selectedApples.push(apple);
                    }
                }
            }

            if (sum === 10 && selectedApples.length > 0) {
                selectedApples.forEach(apple => apple.isCleared = true);
                score += selectedApples.length;
                scoreElement.innerText = score;
            }

            draw();
        }

        canvas.addEventListener('mousedown', onStart);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        canvas.addEventListener('touchstart', onStart, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
    </script>
</body>
</html>
